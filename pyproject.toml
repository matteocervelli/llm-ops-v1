[project]
name = "llm-ops-v1"
version = "0.1.0"
description = "Reference LLM Ops scaffold for the LLM Ops v1 live session."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Matteo Cervelli" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "anthropic>=0.57.0",
  "claude-agent-sdk>=0.2.87",
  "fastapi>=0.136.1",
  "google-generativeai>=0.8.5",
  "httpx>=0.28.1",
  "idna>=3.15",
  "langfuse>=3.0.0",
  "langgraph>=1.2.1",
  "ollama>=0.4.7",
  "openai>=2.0.0",
  "pydantic-ai>=1.99.0",
  "python-dotenv>=1.0.1",
  "redis>=5.0.0",
  "streamlit>=1.40.0",
  "uvicorn>=0.46.0",
]

[project.urls]
Homepage = "https://github.com/matteocervelli/llm-ops-v1"
Repository = "https://github.com/matteocervelli/llm-ops-v1"
Issues = "https://github.com/matteocervelli/llm-ops-v1/issues"

[project.scripts]
llm-ops = "llm_ops_v1.cli:main"

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29.0",
  "jupyter>=1.1.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.399",
  "pytest>=8.3.5",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.11.8",
]

[tool.uv]
constraint-dependencies = [
  "mistralai!=2.4.6",       # Mini Shai-Hulud 2026-05-11: 2.4.6 malicious; quarantined on PyPI
  "guardrails-ai!=0.10.1",  # Mini Shai-Hulud 2026-05-11: 0.10.1 malicious, executes on import
  "urllib3>=2.7.0",          # GHSA-mf9v-mfxr-j63j + GHSA-qccp-gfcp-xxvc: fix in 2.7.0
  "starlette>=1.0.1",        # PYSEC-2026-161: fix in 1.0.1
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_ops_v1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests that exercise a complete agent flow",
  "regression: deterministic regression suite for CI and PR gates",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
