[project]
name = "llm-ops-v1"
version = "0.1.0"
description = "Production-ready LLM Ops scaffold for the LLM Ops v1 live session."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.57.0",
  "authlib>=1.7.1",
  "fastapi>=0.136.1",
  "google-generativeai>=0.8.5",
  "httpx>=0.28.1",
  "idna>=3.15",
  "langfuse>=3.0.0",
  "ollama>=0.4.7",
  "openai>=2.0.0",
  "pydantic-ai>=0.0.39",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.399",
  "pytest>=8.3.5",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.11.8",
]

[tool.uv]
constraint-dependencies = [
  "mistralai!=2.4.6",       # Mini Shai-Hulud 2026-05-11: 2.4.6 malicious; quarantined on PyPI
  "guardrails-ai!=0.10.1",  # Mini Shai-Hulud 2026-05-11: 0.10.1 malicious, executes on import
  "urllib3>=2.7.0",          # GHSA-mf9v-mfxr-j63j + GHSA-qccp-gfcp-xxvc: fix in 2.7.0
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_ops_v1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests that exercise a complete agent flow",
  "regression: deterministic regression suite for CI and PR gates",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
