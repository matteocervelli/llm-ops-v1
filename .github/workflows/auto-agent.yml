name: Auto Agent

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  create-issue-on-ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue for failing CI
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const body = [
              "CI failure detected.",
              "",
              `Workflow: ${run.name}`,
              `Branch: ${run.head_branch}`,
              `Run URL: ${run.html_url}`,
              "",
              "Next step: inspect failure, reproduce locally, and decide whether to delegate to Claude/Codex headless wrappers."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[auto-agent] Investigate failing CI on ${run.head_branch}`,
              body,
              labels: ["automation", "ci"],
            });

  cleanup-stale-branches:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          protected_regex='^(main|master|develop)$'
          cutoff="$(date -u -d '30 days ago' +%s)"
          git for-each-ref --format='%(refname:short) %(committerdate:unix)' refs/remotes/origin | while read -r ref ts; do
            branch="${ref#origin/}"
            if [[ "$branch" =~ $protected_regex ]]; then
              continue
            fi
            if [[ "$ts" -gt "$cutoff" ]]; then
              continue
            fi
            if git branch -r --merged origin/main | grep -q "origin/$branch$"; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
            fi
          done
